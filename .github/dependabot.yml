version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/server"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      major:
        applies-to: version-updates
        update-types: [major]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Must not be newer than engines.vscode, so bump both together by hand
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
